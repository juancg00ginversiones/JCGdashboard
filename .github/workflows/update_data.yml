name: Actualizar datos JCGdashboard

on:
  schedule:
    # ── KEEPALIVE MADRUGADA ── para que GitHub no suspenda el workflow
    # Corre cada 2 horas durante la madrugada AR (no hay mercado igual)
    - cron: '0 2 * * *'    # 23:00 AR
    - cron: '0 4 * * *'    # 01:00 AR
    - cron: '0 6 * * *'    # 03:00 AR
    - cron: '0 8 * * *'    # 05:00 AR
    - cron: '0 10 * * *'   # 07:00 AR
    - cron: '0 11 * * *'   # 08:00 AR — pre apertura
    - cron: '30 11 * * *'  # 08:30 AR — pre apertura

    # ── LUNES A VIERNES ── cada 30 min, 9:00 a 21:30 AR
    - cron: '0 12 * * 1-5'
    - cron: '30 12 * * 1-5'
    - cron: '0 13 * * 1-5'
    - cron: '30 13 * * 1-5'
    - cron: '0 14 * * 1-5'
    - cron: '30 14 * * 1-5'
    - cron: '0 15 * * 1-5'
    - cron: '30 15 * * 1-5'
    - cron: '0 16 * * 1-5'
    - cron: '30 16 * * 1-5'
    - cron: '0 17 * * 1-5'
    - cron: '30 17 * * 1-5'
    - cron: '0 18 * * 1-5'
    - cron: '30 18 * * 1-5'
    - cron: '0 19 * * 1-5'
    - cron: '30 19 * * 1-5'
    - cron: '0 20 * * 1-5'
    - cron: '30 20 * * 1-5'
    - cron: '0 21 * * 1-5'
    - cron: '30 21 * * 1-5'
    - cron: '0 22 * * 1-5'
    - cron: '30 22 * * 1-5'
    - cron: '0 23 * * 1-5'
    - cron: '30 23 * * 1-5'
    - cron: '0 0 * * 2-6'
    - cron: '30 0 * * 2-6'

  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install yfinance pandas numpy --quiet

      - name: Correr script principal
        run: python jcg_data.py

      - name: Commit y push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add jcg_data.json
          git diff --staged --quiet || git commit -m "Update jcg_data.json - $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
