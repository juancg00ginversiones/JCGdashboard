name: Actualizar datos JCGdashboard

on:
  schedule:
    # ── DOMINGO NOCHE ── para que GitHub no suspenda el workflow
    - cron: '0 22 * * 0'   # domingo 19:00 AR — mantiene vivo el workflow

    # ── LUNES A VIERNES ── cada 30 min, 9:00 a 21:30 AR (12:00 a 00:30 UTC)
    # Apertura temprana: 9:00 y 9:30 AR
    - cron: '0 12 * * 1-5'
    - cron: '30 12 * * 1-5'
    # 10:00 y 10:30 AR (apertura NYSE pre-market)
    - cron: '0 13 * * 1-5'
    - cron: '30 13 * * 1-5'
    # 11:00 y 11:30 AR
    - cron: '0 14 * * 1-5'
    - cron: '30 14 * * 1-5'
    # 12:00 y 12:30 AR
    - cron: '0 15 * * 1-5'
    - cron: '30 15 * * 1-5'
    # 13:00 y 13:30 AR (apertura NYSE 10:30 ET)
    - cron: '0 16 * * 1-5'
    - cron: '30 16 * * 1-5'
    # 14:00 y 14:30 AR
    - cron: '0 17 * * 1-5'
    - cron: '30 17 * * 1-5'
    # 15:00 y 15:30 AR
    - cron: '0 18 * * 1-5'
    - cron: '30 18 * * 1-5'
    # 16:00 y 16:30 AR
    - cron: '0 19 * * 1-5'
    - cron: '30 19 * * 1-5'
    # 17:00 y 17:30 AR
    - cron: '0 20 * * 1-5'
    - cron: '30 20 * * 1-5'
    # 18:00 y 18:30 AR
    - cron: '0 21 * * 1-5'
    - cron: '30 21 * * 1-5'
    # 19:00 y 19:30 AR
    - cron: '0 22 * * 1-5'
    - cron: '30 22 * * 1-5'
    # 20:00 y 20:30 AR
    - cron: '0 23 * * 1-5'
    - cron: '30 23 * * 1-5'
    # 21:00 y 21:30 AR (cierre NYSE)
    - cron: '0 0 * * 2-6'
    - cron: '30 0 * * 2-6'

  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install yfinance pandas numpy --quiet

      - name: Correr script principal
        run: python jcg_data.py

      - name: Commit y push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add jcg_data.json
          git diff --staged --quiet || git commit -m "Update jcg_data.json - $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
