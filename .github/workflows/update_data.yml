name: Actualizar datos JCGdashboard

on:
  schedule:
    - cron: '40 13 * * 1-5'
    - cron: '40 14 * * 1-5'
    - cron: '40 15 * * 1-5'
    - cron: '40 16 * * 1-5'
    - cron: '40 17 * * 1-5'
    - cron: '40 18 * * 1-5'
    - cron: '40 19 * * 1-5'
    - cron: '40 20 * * 1-5'
    - cron: '40 21 * * 1-5'
    - cron: '40 22 * * 1-5'
    - cron: '40 23 * * 1-5'

  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install yfinance pandas numpy requests

      - name: Correr script principal
        run: python jcg_data.py

      - name: Correr script fundamental (1x por día, a las 14:40 UTC)
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && contains(github.event.schedule, '40 14'))
        run: python fundamental.py

      - name: Commit y push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add jcg_data.json fundamental_data.json
          git diff --staged --quiet || git commit -m "Update data - $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
