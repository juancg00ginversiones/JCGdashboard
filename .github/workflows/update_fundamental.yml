name: Actualizar Fundamental (semanal)

on:
  schedule:
    # Domingos a las 20:00 UTC = 17:00 AR
    # (2 horas ANTES del keepalive de update_data para evitar conflictos)
    - cron: '0 20 * * 0'

  workflow_dispatch:

jobs:
  update-fundamental:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install yfinance pandas numpy requests --quiet

      - name: Correr análisis fundamental
        run: python fundamental.py

      - name: Commit y push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fundamental_data.json
          git diff --staged --quiet || git commit -m "Update fundamental_data.json - $(date -u '+%Y-%m-%d')"
          git push
