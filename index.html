<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='10' y='40' width='18' height='45' rx='3' fill='%2300ff88'/><rect x='16' y='25' width='6' height='18' rx='1' fill='%2300ff88'/><rect x='16' y='83' width='6' height='12' rx='1' fill='%2300ff88'/><rect x='41' y='20' width='18' height='65' rx='3' fill='%23ff1744'/><rect x='47' y='8' width='6' height='15' rx='1' fill='%23ff1744'/><rect x='47' y='83' width='6' height='12' rx='1' fill='%23ff1744'/><rect x='72' y='30' width='18' height='50' rx='3' fill='%2300ff88'/><rect x='78' y='18' width='6' height='15' rx='1' fill='%2300ff88'/><rect x='78' y='78' width='6' height='12' rx='1' fill='%2300ff88'/></svg>">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JCG Inversiones — Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#050508;--bg2:#08080f;--bg3:#0d0d18;--border:#0f0f1e;--border2:#1a1a2e;--accent:#4f8ef7;--mono:'Share Tech Mono',monospace;--sans:'Rajdhani',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:#c8ccd8;font-family:var(--mono);font-size:11px;min-height:100vh}

/* TOPBAR */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:6px 20px;background:var(--bg2);border-bottom:1px solid var(--border2);position:sticky;top:0;z-index:100;gap:12px}
.topbar-left{display:flex;align-items:center;gap:12px;flex-shrink:0}
.logo-img{width:36px;height:36px;border-radius:4px;object-fit:cover}
.logo-text{display:flex;flex-direction:column;line-height:1.1}
.logo-main{font-family:var(--sans);font-size:18px;font-weight:700;color:#fff;letter-spacing:2px}
.logo-sub{font-family:var(--sans);font-size:11px;font-weight:600;color:#e53935;letter-spacing:3px}

/* BUSCADOR */
.search-wrap{flex:1;max-width:280px}
.search-input{width:100%;background:#0d0d18;border:1px solid #1a1a2e;border-radius:3px;padding:6px 12px;font-family:var(--mono);font-size:11px;color:#c8ccd8;outline:none;letter-spacing:1px}
.search-input::placeholder{color:#252540}
.search-input:focus{border-color:#4f8ef7;box-shadow:0 0 8px rgba(79,142,247,.2)}
.search-active-banner{display:none;background:#0d0d18;border-bottom:1px solid #1a1a2e;padding:6px 20px;font-size:10px;color:#4f8ef7}
.search-active-banner.visible{display:flex;align-items:center;gap:12px}
tr.search-match td{background:rgba(79,142,247,.08)!important}
/* MOBILE */
@media(max-width:768px){
  .topbar{flex-wrap:wrap;gap:8px;padding:8px 12px}
  .topbar-left .logo-main{font-size:14px}
  .topbar-left .logo-sub{font-size:9px}
  .logo-img{width:28px;height:28px}
  .search-wrap{max-width:100%;order:3;flex:0 0 100%}
  .search-input{width:100%;font-size:13px;padding:8px 12px}
  .tabs{overflow-x:auto;padding:0 8px;-webkit-overflow-scrolling:touch}
  .tab{padding:8px 12px;font-size:9px;letter-spacing:1px;white-space:nowrap}
  .tab-content{padding:8px 10px}
  .sectors-grid{grid-template-columns:1fr!important}
  table{font-size:12px}
  td,th{padding:5px 8px!important}
  .tk{font-size:12px!important}
  .rsi{font-size:12px!important;padding:3px 8px!important}
  .chg{font-size:12px!important}
  .logo-img-tk{width:16px!important;height:16px!important}
  .filter-bar{padding:8px 12px;flex-wrap:wrap;gap:6px}
  .filter-btn{font-size:10px;padding:6px 12px}
  .cell1h{min-width:60px}
  .grid1h{grid-template-columns:repeat(auto-fill,minmax(72px,1fr))!important}
  .sector-name{font-size:12px}
  .sector-avg{font-size:11px}
}

.topbar-right{display:flex;gap:16px;align-items:center;font-size:10px;flex-shrink:0}
#upd-time{color:#1a4a1a}
#tcnt{color:#1a1a4a}
#next-upd{color:#2a2a5a}

/* TABS */
.tabs{display:flex;background:var(--bg2);border-bottom:1px solid var(--border2);padding:0 20px}
.tab{padding:10px 18px;font-size:11px;letter-spacing:2px;color:#4a4a7a;border:none;border-bottom:2px solid transparent;background:none;cursor:pointer;font-family:var(--mono);transition:color .15s}
.tab:hover{color:#8a8ab8}
.tab.active{color:#7ab4ff;border-bottom-color:#7ab4ff;text-shadow:0 0 8px rgba(122,180,255,.4)}
.tab-content{display:none;padding:12px 20px}
.tab-content.active{display:block}

/* SEARCH BANNER */
.search-banner{display:none;background:#0d0d18;border:1px solid #1a1a2e;border-radius:3px;padding:8px 14px;margin-bottom:10px;font-size:11px;color:#5a5a9a}
.search-banner.visible{display:block}
.search-result-count{color:var(--accent)}

.region{font-size:10px;letter-spacing:3px;color:var(--accent);margin:10px 0 6px;font-weight:700;opacity:.8}

/* SECTOR GRID */
.sectors-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:7px}
.sector-wrap{background:var(--bg2);border:1px solid var(--border);border-radius:3px;overflow:hidden}
.sector-header{display:flex;align-items:center;justify-content:space-between;padding:6px 12px;background:var(--bg3);cursor:pointer;user-select:none}
.sector-header:hover{background:#111120}
.sector-name{font-family:var(--sans);font-size:13px;font-weight:700;color:#8888c0;letter-spacing:1.5px}
.sector-right{display:flex;align-items:center;gap:8px}
.sector-avg{font-size:11px;font-weight:700;padding:2px 8px;border-radius:2px;min-width:60px;text-align:center}
.arrow{font-size:9px;color:#252540;transition:transform .2s}
.arrow.open{transform:rotate(90deg)}
.sector-body{display:none}
.sector-body.open{display:block}

/* TABLE */
table{width:100%;border-collapse:collapse}
th{font-size:9px;letter-spacing:1px;color:#3a3a5e;padding:4px 10px;text-align:right;border-bottom:1px solid var(--border2);font-weight:700}
th:first-child{text-align:left}
td{padding:5px 10px;text-align:right;border-bottom:1px solid rgba(15,15,30,.8);font-size:11px}
td:first-child{text-align:left}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(79,142,247,.03)}
tr.hidden-row{display:none}
.tk{color:#7a7ab0;font-weight:700;font-size:11px;display:flex;align-items:center;gap:5px}
.tk-double-green{color:#00ff88;font-weight:700;font-size:11px;display:flex;align-items:center;gap:5px;text-shadow:0 0 10px rgba(0,255,136,.8);animation:pulse-green 1.5s infinite}
.tk-double-red{color:#ff1744;font-weight:700;font-size:11px;display:flex;align-items:center;gap:5px;text-shadow:0 0 10px rgba(255,23,68,.8);animation:pulse-red 1.5s infinite}
.tk-logo{width:14px;height:14px;border-radius:2px;object-fit:contain;background:#0d0d18;flex-shrink:0;vertical-align:middle}
tr.row-buy td{background:rgba(0,255,136,.10)!important;border-bottom:1px solid rgba(0,255,136,.2)!important;border-top:1px solid rgba(0,255,136,.08)!important}
tr.row-sell td{background:rgba(255,23,68,.10)!important;border-bottom:1px solid rgba(255,23,68,.2)!important;border-top:1px solid rgba(255,23,68,.08)!important}
tr.row-buy:hover td{background:rgba(0,255,136,.16)!important}
tr.row-sell:hover td{background:rgba(255,23,68,.16)!important}
@keyframes pulse-green{0%,100%{text-shadow:0 0 6px rgba(0,255,136,.6)}50%{text-shadow:0 0 16px rgba(0,255,136,1)}}
@keyframes pulse-red{0%,100%{text-shadow:0 0 6px rgba(255,23,68,.6)}50%{text-shadow:0 0 16px rgba(255,23,68,1)}}

/* %DÍA */
.chg{font-size:11px;font-weight:600;display:inline-block;padding:1px 5px;border-radius:2px}
.cpp{color:#00ff88;font-weight:700;background:#003319;box-shadow:0 0 8px rgba(0,255,136,.3)}
.cp {color:#00c853;background:#001a0d}
.cz {color:#1a1a30;background:transparent;font-weight:400}
.cn {color:#ff5252;background:#160008}
.cnn{color:#ff1744;font-weight:700;background:#330010;box-shadow:0 0 8px rgba(255,23,68,.3)}

/* RSI */
.rsi{display:inline-block;padding:2px 8px;border-radius:2px;font-size:11px;font-weight:700;min-width:38px;text-align:center}
.r-sbv2{background:#004d1f;color:#00ff88;box-shadow:0 0 12px rgba(0,255,136,.55);border:1px solid rgba(0,255,136,.2)}
.r-sbv1{color:#00c853;font-weight:600}
.r-neu {color:#252540;font-weight:400}
.r-hi1 {color:#ff7043;font-weight:600}
.r-hi2 {background:#4d0010;color:#ff1744;box-shadow:0 0 12px rgba(255,23,68,.55);border:1px solid rgba(255,23,68,.2)}

/* MEDIAS SEMANALES — colores suaves, solo SMA200 intensa */
.dw-up   { color:#4a7a5a }           /* suave arriba */
.dw-dn   { color:#6a3a3a }           /* suave abajo */
.dw-neu  { color:#1a1a30 }           /* neutral */
.dw-s200u{ color:#00c853 }           /* arriba SMA200 — verde moderado */
.dw-s200d{ color:#ff5252;font-weight:700 }  /* abajo SMA200 — rojo visible */

/* KONC */
.m-mar{color:#00ff88;font-weight:700;text-shadow:0 0 10px rgba(0,255,136,.7)}.m-lo{color:#00c853;font-weight:600}.m-neu{color:#1a1a30}.m-hi1{color:#ff7043;font-weight:600}.m-hi2{color:#ff1744;font-weight:700;text-shadow:0 0 10px rgba(255,23,68,.7)}
.mhi{color:#ff1744;font-weight:700}.mlo{color:#00e676;font-weight:700}.mne{color:#1a1a30}

/* MEDIAS */
.d-faru{color:#00ff88;font-weight:700}.d-nearu{color:#ffd600}
.d-neu{color:#1a1a30}.d-neard{color:#ff6d00}
.d-fard{color:#ff1744;font-weight:700}

/* RSI 1H */
.grid1h{display:grid;grid-template-columns:repeat(auto-fill,minmax(60px,1fr));gap:4px;padding:8px 10px}
.cell1h{padding:6px 3px;border-radius:3px;text-align:center;font-size:11px;font-weight:700}
.c-over{background:#4d0010;color:#ff1744;box-shadow:0 0 8px rgba(255,23,68,.45)}
.c-sbv {background:#004d1f;color:#00ff88;box-shadow:0 0 8px rgba(0,255,136,.45)}
.c-neu {background:#0a0a18;color:#1a1a30;font-weight:400}
.val1h{font-size:9px;margin-top:2px;opacity:.6}

/* SEÑALES — chips más anchos */
.sig-section-title{font-size:12px;letter-spacing:2px;color:#8888c0;font-weight:700;margin:14px 0 8px;padding-bottom:6px;border-bottom:1px solid #2a2a4a}
.sig-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:6px;margin-bottom:12px}
.sig-chip{border-radius:4px;overflow:hidden;cursor:pointer;border:1px solid transparent}
.sig-chip-head{padding:10px 12px;font-size:13px;font-weight:700;user-select:none;font-family:var(--sans)}
.sig-chip-head .chip-ticker{font-size:15px;letter-spacing:1px}
.sig-chip-head .chip-sub{font-size:10px;font-weight:600;margin-top:2px;font-family:var(--mono);opacity:.85}
.sig-chip-body{display:none;background:#0a0a18;border-top:1px solid var(--border2);padding:10px 12px;font-size:11px;line-height:1.9}
.sig-chip-body.open{display:block}
.sig-chip-body .chip-meta{color:#4a4a7a;margin-bottom:6px}
.sig-chip-body table{width:100%;border-collapse:collapse}
.sig-chip-body th{font-size:9px;color:#3a3a5e;padding:3px 8px;text-align:right;border-bottom:1px solid var(--border2);letter-spacing:1px}
.sig-chip-body th:first-child{text-align:left}
.sig-chip-body td{font-size:11px;padding:3px 8px;text-align:right;border-bottom:1px solid rgba(15,15,30,.6)}
.sig-chip-body td:first-child{text-align:left;color:#4a4a7a}
.sig-chip-body tr:last-child td{border-bottom:none}

.sig-chip.wt-fuerte{border-color:rgba(0,255,136,.2)}
.sig-chip.wt-fuerte .sig-chip-head{background:#004d1f;color:#00ff88}
.sig-chip.wt-normal .sig-chip-head{background:#001a0d;color:#00c853}
.sig-chip.rsi-over{border-color:rgba(255,23,68,.2)}
.sig-chip.rsi-over .sig-chip-head{background:#4d0010;color:#ff1744}
.sig-chip.rsi-sbv{border-color:rgba(0,255,136,.2)}
.sig-chip.rsi-sbv .sig-chip-head{background:#004d1f;color:#00ff88}

.ret-pos{color:#00c853}.ret-neg{color:#ff5252}.ret-neu{color:#252540}
.no-sig{color:#252540;font-size:11px;padding:12px 0}

/* FILTER BUTTONS */
.filter-bar{display:flex;gap:8px;margin-bottom:10px;align-items:center}
.filter-btn{display:flex;align-items:center;gap:6px;padding:6px 14px;border-radius:3px;border:none;cursor:pointer;font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:1px;transition:all .15s}
.filter-btn .dot{width:8px;height:8px;border-radius:50%}
.btn-buy{background:#003319;color:#00ff88;border:1px solid rgba(0,255,136,.25)}
.btn-buy:hover,.btn-buy.active{background:#004d1f;box-shadow:0 0 10px rgba(0,255,136,.3)}
.btn-sell{background:#330010;color:#ff1744;border:1px solid rgba(255,23,68,.25)}
.btn-sell:hover,.btn-sell.active{background:#4d0010;box-shadow:0 0 10px rgba(255,23,68,.3)}
.btn-clear{background:#0d0d18;color:#3a3a5e;border:1px solid #1a1a2e}
.btn-clear:hover{color:#6a6a9a}
.filter-count{font-size:10px;color:#3a3a5e;margin-left:4px}

/* MOBILE */
@media (max-width: 768px) {
  .topbar{flex-wrap:wrap;gap:6px;padding:6px 12px}
  .topbar-left{flex:1}
  .logo-main{font-size:15px}
  .logo-sub{font-size:9px}
  .search-wrap{order:3;width:100%;max-width:100%}
  .search-input{width:100%;font-size:13px;padding:8px 12px}
  .topbar-right{font-size:9px;gap:8px}
  .tabs{overflow-x:auto;padding:0 8px;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{padding:8px 12px;font-size:10px;white-space:nowrap;letter-spacing:1px}
  .tab-content{padding:8px 10px}
  .sectors-grid{grid-template-columns:1fr!important}
  .sector-name{font-size:12px}
  th{font-size:9px;padding:4px 8px;letter-spacing:0}
  td{font-size:11px;padding:4px 8px}
  .tk{font-size:11px}
  .tk-logo{width:13px;height:13px}
  .rsi{font-size:10px;padding:2px 6px;min-width:32px}
  .chg{font-size:11px;padding:1px 4px}
  .filter-bar{padding:6px 10px;gap:6px;flex-wrap:wrap}
  .filter-btn{font-size:10px;padding:5px 10px}
  .grid1h{grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:3px;padding:6px 8px}
  .cell1h{padding:5px 2px;font-size:10px}
}

/* SEARCH RESULT HIGHLIGHT */
.search-match td{background:rgba(79,142,247,.08)!important}
.search-match .tk, .search-match .tk-double-green, .search-match .tk-double-red{
  font-size:13px!important;
}
.search-result-banner{
  background:#0d0d18;border:1px solid #4f8ef7;border-radius:3px;
  padding:8px 14px;margin-bottom:10px;font-size:11px;color:#4f8ef7;
  display:none;
}

.loading{text-align:center;padding:60px;color:#252540}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}
.err{color:#ff1744;padding:20px;font-size:11px;line-height:2}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <img class="logo-img" src="https://raw.githubusercontent.com/juancg00ginversiones/JCGdashboard/main/logoJCG.png" alt="JCG" onerror="this.style.display='none'">
    <div class="logo-text">
      <span class="logo-main">JCG</span>
      <span class="logo-sub">Inversiones</span>
    </div>
  </div>

  <div class="search-wrap">
    <input class="search-input" id="searchBox" type="text" placeholder="Buscar ticker... ej: SPY" oninput="filterTickers(this.value)">
  </div>

  <div class="topbar-right">
    <span id="upd-time">—</span>
    <span id="tcnt">—</span>
    <span id="next-upd">—</span>
  </div>
</div>

<div class="tabs">
  <button class="tab active" onclick="sw('ind',this)">INDICADORES</button>
  <button class="tab" onclick="sw('med',this)">MEDIAS</button>
  <button class="tab" onclick="sw('h1',this)">RSI 1H</button>
  <button class="tab" onclick="sw('sig',this)">SEÑALES</button>
  <button class="tab" onclick="sw('sem',this)">SEMANAL</button>
  <button class="tab" onclick="sw('fun',this)">ANÁLISIS FUND.</button>
  <button class="tab" onclick="sw('glos',this)">GLOSARIO</button>
</div>

<div class="filter-bar" id="filterBar" style="display:none;padding:8px 20px;background:var(--bg2);border-bottom:1px solid var(--border2)">
    <button class="filter-btn btn-buy" onclick="setFilter('buy',this)">
      <span class="dot" style="background:#00ff88;box-shadow:0 0 6px rgba(0,255,136,.6)"></span>
      OPORTUNIDADES
      <span class="filter-count" id="cnt-buy"></span>
    </button>
    <button class="filter-btn btn-sell" onclick="setFilter('sell',this)">
      <span class="dot" style="background:#ff1744;box-shadow:0 0 6px rgba(255,23,68,.6)"></span>
      SOBRECOMPRA
      <span class="filter-count" id="cnt-sell"></span>
    </button>
    <button class="filter-btn btn-clear" onclick="setFilter(null,this)">✕ VER TODO</button>
</div>

<div class="search-result-banner" id="searchBanner"></div>
<div class="search-active-banner" id="searchBanner">
  <div id="searchBannerContent" style="flex:1"></div>
  <button onclick="clearSearch()" style="background:#1a1a2e;border:none;color:#4a4a7a;cursor:pointer;font-family:var(--mono);font-size:10px;padding:4px 10px;border-radius:2px;flex-shrink:0">✕ limpiar</button>
</div>
<div class="tab-content active" id="ind"><div class="loading"><span class="spin"></span>Cargando...</div></div>
<div class="tab-content" id="med"><div class="loading"><span class="spin"></span>Cargando...</div></div>
<div class="tab-content" id="h1"><div class="loading"><span class="spin"></span>Cargando...</div></div>
<div class="tab-content" id="sig"><div class="loading"><span class="spin"></span>Cargando...</div></div>
<div class="tab-content" id="sem"><div class="loading"><span class="spin"></span>Cargando...</div></div>
<div class="tab-content" id="fun"><div class="loading"><span class="spin"></span>Cargando...</div></div>
<div class="tab-content" id="glos"></div>

<script>
const JSON_URL='https://juancg00ginversiones.github.io/JCGdashboard/jcg_data.json';

function clsChg(v){if(v===null)return'cz';if(v>5)return'cpp';if(v>0)return'cp';if(v<-5)return'cnn';if(v<0)return'cn';return'cz'}
function clsRsi(v){if(v===null)return'r-neu';if(v<=30)return'r-sbv2';if(v<=45)return'r-sbv1';if(v>=70)return'r-hi2';if(v>=65)return'r-hi1';return'r-neu'}
function clsMrn(v){if(v===null)return'm-neu';if(v<0)return'm-mar';if(v<20)return'm-lo';if(v<85)return'm-neu';if(v<=105)return'm-hi1';return'm-hi2'}
function clsMcd(v){if(v===null)return'mne';if(v>30)return'mhi';if(v<-30)return'mlo';return'mne'}
function clsDist(v){if(v===null)return'd-neu';if(v>5)return'd-faru';if(v>1)return'd-nearu';if(v<-5)return'd-fard';if(v<-1)return'd-neard';return'd-neu'}
function cls1h(v){if(v===null||v===undefined)return'c-neu';if(v>=70)return'c-over';if(v<=30)return'c-sbv';return'c-neu'}
function fv(v,d){if(v===null||v===undefined)return'--';return parseFloat(v).toFixed(d!==undefined?d:1)}
function fc(v){if(v===null)return'--';return(v>=0?'+':'')+parseFloat(v).toFixed(2)+'%'}
function fd(v){if(v===null)return'--';return(v>=0?'▲':'▼')+Math.abs(parseFloat(v)).toFixed(1)+'%'}
function clsRet(v){if(v===null)return'ret-neu';return v>0?'ret-pos':'ret-neg'}

function avgHtml(ts,dat){
  const vals=ts.filter(t=>dat[t]&&dat[t].pct_dia!==null).map(t=>dat[t].pct_dia);
  if(!vals.length)return'';
  const avg=vals.reduce((a,b)=>a+b,0)/vals.length;
  let c,bg,sh;
  if(avg>2){c='#00ff88';bg='#003319';sh='0 0 6px rgba(0,255,136,.3)'}
  else if(avg>0){c='#00c853';bg='#001a0d';sh='none'}
  else if(avg<-2){c='#ff1744';bg='#330010';sh='0 0 6px rgba(255,23,68,.3)'}
  else{c='#ff5252';bg='#160008';sh='none'}
  return `<span class="sector-avg" style="color:${c};background:${bg};box-shadow:${sh}">${avg>=0?'+':''}${avg.toFixed(2)}%</span>`;
}

function toggle(el){

// ── BUSCADOR — solo ticker exacto ────────────────────────
function filterTickers(query){
  const q      = query.trim().toUpperCase();
  const banner = document.getElementById('searchBanner');
  let   found  = null;  // primer row exacto encontrado

  // Reset todo si vacío
  if(!q){
    document.querySelectorAll('tbody tr').forEach(r=>{
      r.classList.remove('hidden-row','search-match');
      r.style.display='';
    });
    document.querySelectorAll('.cell1h').forEach(c=>{
      c.style.display=''; c.style.outline='';
    });
    document.querySelectorAll('.sector-wrap').forEach(s=>s.style.display='');
    if(banner) banner.classList.remove('visible');
    return;
  }

  // Filas de tablas — mostrar SOLO el ticker exacto
  document.querySelectorAll('tbody tr').forEach(row=>{
    const tkEl = row.querySelector('[class*="tk"]');
    if(!tkEl){ row.style.display='none'; return; }
    // Extraer solo el texto del ticker (ignorar img y texto del logo)
    const spans = tkEl.querySelectorAll('div,span');
    let tickerText = '';
    if(spans.length){
      spans.forEach(s=>{ if(!s.querySelector('img') && s.textContent.trim()) tickerText = s.textContent.trim(); });
    }
    if(!tickerText) tickerText = tkEl.textContent.replace(/[^A-Z0-9\-]/g,'').trim();
    tickerText = tickerText.toUpperCase();

    if(tickerText === q){
      row.style.display = '';
      row.classList.add('search-match');
      if(!found) found = {ticker: q, row};
    } else {
      row.style.display = 'none';
      row.classList.remove('search-match');
    }
  });

  // Chips 1H — solo exacto
  document.querySelectorAll('.cell1h').forEach(cell=>{
    const t = (cell.querySelector('div')?.textContent||'').trim().toUpperCase();
    if(t === q){
      cell.style.display='';
      cell.style.outline='2px solid #4f8ef7';
    } else {
      cell.style.display='none';
      cell.style.outline='';
    }
  });

  // Sectores — mostrar solo el que tiene el ticker, abrir automático
  document.querySelectorAll('.sector-wrap').forEach(sw=>{
    const hasTbl  = sw.querySelector('tbody');
    const hasGrid = sw.querySelector('.grid1h');
    let hasMatch  = false;
    if(hasTbl)  hasMatch = [...sw.querySelectorAll('tbody tr')].some(r=>r.style.display!=='none');
    if(hasGrid) hasMatch = [...sw.querySelectorAll('.cell1h')].some(c=>c.style.display!=='none');
    sw.style.display = hasMatch ? '' : 'none';
    if(hasMatch){
      sw.querySelector('.sector-body')?.classList.add('open');
      sw.querySelector('.arrow')?.classList.add('open');
    }
  });

  // Banner info ticker
  if(!banner) return;
  if(!found){ banner.classList.remove('visible'); return; }

  const d  = window._datos?.[q];
  const g  = (typeof GLOSARIO !== 'undefined') ? GLOSARIO[q] : null;
  const rc = g ? riesgoColor(g.riesgo) : '#4a4a7a';

  banner.classList.add('visible');
  const bc = document.getElementById('searchBannerContent');
  if(bc) bc.innerHTML = `
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:${g?.desc?'4px':'0'}">
      ${logoImg(q)}
      <span style="color:#fff;font-size:15px;font-weight:700">${q}</span>
      ${g ? `<span style="color:#7a7aaa;font-size:11px">${g.nombre}</span>` : ''}
      ${g ? `<span style="color:${rc};font-size:10px;font-weight:700">● ${g.riesgo.toUpperCase()}</span>` : ''}
      ${d ? `<span class="chg ${clsChg(d?.pct_dia)}">${fc(d?.pct_dia)}</span>` : ''}
      ${d ? `<span class="rsi ${clsRsi(d?.rsi_1d)}">RSI ${fv(d?.rsi_1d,1)}</span>` : ''}
      ${d?.rsi_1h ? `<span style="color:#4a4a7a;font-size:10px">1H: ${fv(d.rsi_1h,1)}</span>` : ''}
      ${g?.pais ? `<span style="color:#3a3a5e;font-size:10px">${g.pais}</span>` : ''}
    </div>
    ${g?.desc ? `<div style="color:#6a6a9a;font-size:11px;line-height:1.5">${g.desc}</div>` : ''}`;

  // Scroll al ticker encontrado
  found.row.scrollIntoView({behavior:'smooth', block:'center'});
}

  if(v<0)return'm-mar';if(v<20)return'm-lo';
  if(v<85)return'm-neu';if(v<=105)return'm-hi1';

function metodoDiario(d){
  // Necesita datos de medias
  if(d.rsi_1d===null||d.marron===null) return false;
  // RSI debe estar cruzando al alza su WMA21 — entrada fresca
  if(!d.rsi_cruza_alza) return false;
  // Anuladores
  if(d.rsi_1d >= 65)   return false;  // RSI saturado
  if(d.marron >= 100)  return false;  // KONCORD saturado

  const dists = [
    {n:'EMA21',  v: d.dist_ema21},
    {n:'SMA30',  v: d.dist_sma30},
    {n:'EMA150', v: d.dist_ema150},
    {n:'EMA200', v: d.dist_ema200},
  ].filter(x => x.v !== null);

  if(!dists.length) return false;

  // Precio debe estar arriba de al menos una media
  const superaAlguna = dists.some(x => x.v > 0);
  if(!superaAlguna) return false;

  // No debe haber ninguna media por encima a menos de 5%
  const mediaArriba = dists.some(x => x.v < 0 && x.v > -5);
  if(mediaArriba) return false;

  return true;
}

let activeFilter = null;
window._activeTab = 'ind';

function setFilter(type, btn){
  activeFilter = type;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  if(btn && type) btn.classList.add('active');
  applyFilter();
}

function isBuySignal(d){
  // Oportunidad CLARA: RSI <= 30 Y KONCORD < 10
  const rsi=d.rsi_1d, mrn=d.marron;
  return (rsi!==null && rsi<=30) && (mrn!==null && mrn<10);
}
function isSellSignal(d){
  // Sobrecompra CLARA: RSI >= 70 Y KONCORD > 95
  const rsi=d.rsi_1d, mrn=d.marron;
  return (rsi!==null && rsi>=70) && (mrn!==null && mrn>95);
}

function applyFilter(){
  const tab = window._activeTab || 'ind';
  const prefix = tab==='h1' ? '' : '';

  // Filas de tabla (ind y med)
  if(tab==='ind'||tab==='med'){
    document.querySelectorAll('#'+tab+' tbody tr').forEach(row=>{
      if(row.classList.contains('hidden-row')) return;
      const t=row.getAttribute('data-ticker');
      if(!t||!window._datos||!window._datos[t]){row.style.display=activeFilter?'none':'';return;}
      const d=window._datos[t];
      if(!activeFilter){row.style.display='';return;}
      const match = activeFilter==='buy' ? isBuySignal(d) : isSellSignal(d);
      row.style.display = match ? '' : 'none';
    });
    document.querySelectorAll('#'+tab+' .sector-wrap').forEach(sw=>{
      if(!sw.querySelector('tbody'))return;
      const vis=[...sw.querySelectorAll('tbody tr')].filter(r=>r.style.display!=='none'&&!r.classList.contains('hidden-row'));
      sw.style.display=vis.length===0&&activeFilter?'none':'';
      if(vis.length>0&&activeFilter){
        sw.querySelector('.sector-body').classList.add('open');
        const arr=sw.querySelector('.arrow');if(arr)arr.classList.add('open');
      }
    });
  }

  // Chips 1H
  if(tab==='sem'){
    document.querySelectorAll('#sem tbody tr').forEach(row=>{
      if(row.classList.contains('hidden-row'))return;
      const t=row.getAttribute('data-ticker');
      if(!t||!window._datos||!window._datos[t]){row.style.display=activeFilter?'none':'';return;}
      const d=window._datos[t];
      if(!activeFilter){row.style.display='';return;}
      const match=activeFilter==='buy'?isBuySignalW(d):isSellSignalW(d);
      row.style.display=match?'':'none';
    });
    document.querySelectorAll('#sem .sector-wrap').forEach(sw=>{
      if(!sw.querySelector('tbody'))return;
      const vis=[...sw.querySelectorAll('tbody tr')].filter(r=>r.style.display!=='none'&&!r.classList.contains('hidden-row'));
      sw.style.display=vis.length===0&&activeFilter?'none':'';
      if(vis.length>0&&activeFilter){
        sw.querySelector('.sector-body').classList.add('open');
        const arr=sw.querySelector('.arrow');if(arr)arr.classList.add('open');
      }
    });
  }

  if(tab==='h1'){
    document.querySelectorAll('#h1 .cell1h').forEach(cell=>{
      const t=cell.getAttribute('data-ticker');
      if(!t||!window._datos||!window._datos[t]){cell.style.display=activeFilter?'none':'';return;}
      const d=window._datos[t];
      if(!activeFilter){cell.style.display='';return;}
      const match = activeFilter==='buy' ? isBuySignal(d) : isSellSignal(d);
      cell.style.display=match?'':'none';
    });
    // ocultar sectores sin chips visibles
    document.querySelectorAll('#h1 .sector-wrap').forEach(sw=>{
      const grid=sw.querySelector('.grid1h');if(!grid)return;
      const vis=[...grid.querySelectorAll('.cell1h')].filter(c=>c.style.display!=='none');
      sw.style.display=vis.length===0&&activeFilter?'none':'';
      if(vis.length>0&&activeFilter){
        sw.querySelector('.sector-body').classList.add('open');
        const arr=sw.querySelector('.arrow');if(arr)arr.classList.add('open');
      }
    });
  }
}

function updateFilterCounts(datos){
  let buy=0, sell=0;
  Object.values(datos).forEach(d=>{
    if(isBuySignal(d))  buy++;
    if(isSellSignal(d)) sell++;
  });
  document.getElementById('cnt-buy').textContent  = buy  ? '('+buy+')' : '';
  document.getElementById('cnt-sell').textContent = sell ? '('+sell+')': '';
}

const FUN_URL = 'https://juancg00ginversiones.github.io/JCGdashboard/fundamental_data.json';

function scoreColor(s){
  if(s===null||s===undefined) return '#2a2a4a';
  if(s>=3)  return '#00ff88';
  if(s>=2)  return '#00c853';
  if(s>=1)  return '#69f0ae';
  if(s===0) return '#4a4a7a';
  if(s>=-1) return '#ff8a50';
  if(s>=-2) return '#ff5252';
  return '#ff1744';
}
function scoreBg(s){
  if(s===null||s===undefined) return 'transparent';
  if(s>=2)  return 'rgba(0,255,136,.08)';
  if(s>=1)  return 'rgba(0,200,100,.05)';
  if(s===0) return 'transparent';
  if(s>=-1) return 'rgba(255,100,0,.06)';
  return 'rgba(255,23,68,.08)';
}
function fmtFun(v, suffix){
  if(v===null||v===undefined) return '<span style="color:#2a2a4a">—</span>';
  return v + (suffix||'');
}
function scoreCell(v, s, suffix){
  const c = scoreColor(s);
  const bg = scoreBg(s);
  const val = (v===null||v===undefined) ? '—' : v+(suffix||'');
  return `<span style="color:${c};background:${bg};padding:1px 5px;border-radius:2px;font-size:11px">${val}</span>`;
}
function globalScoreHtml(s){
  const c = scoreColor(s);
  const label = s>=2?'FUERTE':s>=1?'BUENO':s===0?'NEUTRO':s>=-1?'DÉBIL':'NEGATIVO';
  return `<span style="color:${c};font-weight:700;font-size:11px;padding:2px 8px;background:${scoreBg(s)};border-radius:2px">${s>0?'+':''}${s} ${label}</span>`;
}

function nextUpdate(){
  const now=new Date(),next=new Date(now);
  next.setMinutes(40,0,0);
  if(next<=now)next.setHours(next.getHours()+1);
  document.getElementById('next-upd').textContent='próx. ~'+Math.round((next-now)/60000)+'min';
}

async function loadData(){
  try{
    const resp=await fetch(JSON_URL+'?t='+Date.now());
    if(!resp.ok)throw new Error('HTTP '+resp.status);
    const data=await resp.json();
    const{sectores_usa,sectores_world,datos,actualizado}=data;
    if(!datos||!Object.keys(datos).length)throw new Error('Sin datos aún');
    document.getElementById('upd-time').textContent='Act: '+actualizado;
    window._datos = datos;
    document.getElementById('filterBar').style.display='flex';
    updateFilterCounts(datos);
    document.getElementById('tcnt').textContent=Object.keys(datos).length+' tickers';
    document.getElementById('ind').innerHTML=renderGrid(sectores_usa,datos,thInd,rowInd,'USA')+renderGrid(sectores_world,datos,thInd,rowInd,'MUNDIAL');
    document.getElementById('med').innerHTML=renderGrid(sectores_usa,datos,thMed,rowMed,'USA')+renderGrid(sectores_world,datos,thMed,rowMed,'MUNDIAL');
    document.getElementById('h1').innerHTML=renderGrid(sectores_usa,datos,null,null,'USA',true)+renderGrid(sectores_world,datos,null,null,'MUNDIAL',true);
    document.getElementById('sig').innerHTML=renderSenales({...data, datos});
    document.getElementById('sem').innerHTML=renderSemanal(sectores_usa,datos,'USA')+renderSemanal(sectores_world,datos,'MUNDIAL');
    // re-aplicar filtro si había algo escrito
    const q=document.getElementById('searchBox').value;
    if(q)filterTickers(q);
    if(activeFilter) applyFilter();
    nextUpdate();

    // Cargar fundamental por separado (archivo separado)
    fetch(FUN_URL+'?t='+Date.now())
      .then(r=>r.ok?r.json():null)
      .then(funData=>{
        document.getElementById('fun').innerHTML = funData
          ? renderFundamental(funData)
          : '<div class="err">❌ Corré fundamental.py y subí fundamental_data.json al repo</div>';
      })
      .catch(()=>{
        document.getElementById('fun').innerHTML =
          '<div class="err">❌ Corré fundamental.py y subí fundamental_data.json al repo</div>';
      });
  }catch(e){
    ['ind','med','h1','sig'].forEach(id=>{
      document.getElementById(id).innerHTML=`<div class="err">❌ ${e.message}</div>`;
    });
  }
}

  if(id==='glos' && document.getElementById('glos').innerHTML==='') renderGlosario();
  const q=document.getElementById('searchBox').value;
  if(q && id!=='glos') filterTickers(q);
}
</script>
